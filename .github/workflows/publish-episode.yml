name: Publish Future CFO_DP Episode

on:
  push:
    paths:
      - 'episodes/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build episodes index from metadata + actual files
        run: |
          python << 'EOF'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          ROOT = Path('.')
          EPISODES_DIR = ROOT / 'episodes'
          INDEX_PATH = ROOT / 'data' / 'episodes.json'

          def pick_file(episode_dir: Path, meta_value: str, patterns: list) -> str:
              if meta_value:
                  candidate = episode_dir / Path(meta_value).name
                  if candidate.exists():
                      return candidate.name
              for pattern in patterns:
                  matches = sorted(episode_dir.glob(pattern))
                  if matches:
                      return matches[0].name
              return ''

          episodes = []
          notes = []

          if not EPISODES_DIR.exists():
              print('No episodes/ directory found.')
          else:
              for year_dir in sorted(EPISODES_DIR.glob('[0-9][0-9][0-9][0-9]'), reverse=True):
                  for month_dir in sorted(year_dir.glob('[0-9][0-9]'), reverse=True):
                      for episode_dir in sorted(
                          [p for p in month_dir.iterdir() if p.is_dir()],
                          key=lambda p: p.name,
                          reverse=True,
                      ):
                          meta_path = episode_dir / 'metadata.json'
                          if not meta_path.exists():
                              notes.append(f'Skip (no metadata.json): {episode_dir}')
                              continue
                          try:
                              meta = json.loads(meta_path.read_text(encoding='utf-8'))
                          except Exception as e:
                              notes.append(f'Skip (bad JSON): {meta_path}: {e}')
                              continue
                          if not meta.get('id') or not meta.get('title') or not meta.get('date'):
                              notes.append(f'Skip (missing id/title/date): {meta_path}')
                              continue

                          rel = episode_dir.as_posix()

                          ppt_name = pick_file(episode_dir, meta.get('presentation', ''), [
                              'Future_CFO_DP_Daily_*.pptx', 'Future_CFO_Daily_*.pptx', 'presentation.pptx', '*.pptx'
                          ])
                          pdf_name = pick_file(episode_dir, meta.get('pdf', ''), [
                              'Future_CFO_DP_Daily_*.pdf', 'Future_CFO_Daily_*.pdf', 'learning-brief.pdf', '*.pdf'
                          ])
                          audio_name = pick_file(episode_dir, meta.get('audio', ''), [
                              'Future_CFO_DP_Daily_*_Indian_English.mp3', 'Future_CFO_Daily_*_Indian_English.mp3',
                              'Future_CFO_DP_Daily_*.mp3', 'Future_CFO_Daily_*.mp3', 'voiceover.mp3', '*.mp3'
                          ])
                          video_name = pick_file(episode_dir, meta.get('video', ''), [
                              'Future_CFO_DP_Daily_*_Synced.mp4', 'Future_CFO_Daily_*_Synced.mp4',
                              'Future_CFO_DP_Daily_*.mp4', 'Future_CFO_Daily_*.mp4', 'synced-lesson.mp4', '*.mp4'
                          ])

                          if not any([ppt_name, pdf_name, audio_name, video_name]):
                              notes.append(f'Skip (no media files yet): {episode_dir}')
                              continue

                          entry = {
                              'id': meta.get('id'),
                              'title': meta.get('title'),
                              'subtitle': meta.get('subtitle', ''),
                              'date': meta.get('date'),
                              'category': meta.get('category', ''),
                              'topics': meta.get('topics', []),
                              'description': meta.get('description', ''),
                              'thumbnail': f'{rel}/thumbnail.jpg' if (episode_dir / 'thumbnail.jpg').exists() else '',
                              'presentation': f'{rel}/{ppt_name}' if ppt_name else '',
                              'pdf': f'{rel}/{pdf_name}' if pdf_name else '',
                              'audio': f'{rel}/{audio_name}' if audio_name else '',
                              'duration': meta.get('duration', ''),
                              'featured': bool(meta.get('featured', False)),
                              'tags': meta.get('tags', []),
                              'sources': meta.get('sources', []),
                          }
                          if video_name:
                              entry['video'] = f'{rel}/{video_name}'

                          episodes.append(entry)
                          print(f'Indexed: {entry["date"]} | {entry["title"][:60]} | video={bool(video_name)}')

          episodes.sort(key=lambda x: x.get('date', ''), reverse=True)
          featured_seen = False
          for ep in episodes:
              if ep.get('featured'):
                  if featured_seen:
                      ep['featured'] = False
                  else:
                      featured_seen = True

          index = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'total_episodes': len(episodes),
              'episodes': episodes,
          }
          INDEX_PATH.parent.mkdir(parents=True, exist_ok=True)
          INDEX_PATH.write_text(json.dumps(index, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(f'\nIndex written: {len(episodes)} episode(s).')
          for n in notes:
              print(f'  - {n}')
          EOF

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/episodes.json
          if git diff --staged --quiet; then
            echo "No changes to index."
          else
            git commit -m "chore: auto-update episodes index [skip ci]"
            git push
          fi
